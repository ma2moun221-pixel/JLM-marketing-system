  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "07-usage-2";
      var NS = "http://www.w3.org/2000/svg";
      function el(name) { return document.getElementById(FID + "-" + name); }
      function deg(a) { return (a * Math.PI) / 180; }

      // --- build deterministic SVG detail ---
      var knurl = el("knurl");
      for (var i = 0; i < 60; i++) {
        var a = deg(i * 6);
        var ln = document.createElementNS(NS, "line");
        ln.setAttribute("x1", (346 * Math.cos(a)).toFixed(2));
        ln.setAttribute("y1", (346 * Math.sin(a)).toFixed(2));
        ln.setAttribute("x2", (358 * Math.cos(a)).toFixed(2));
        ln.setAttribute("y2", (358 * Math.sin(a)).toFixed(2));
        ln.setAttribute("stroke", "#C0C4C7");
        ln.setAttribute("stroke-width", "2");
        ln.setAttribute("stroke-opacity", "0.6");
        knurl.appendChild(ln);
      }
      var notches = el("notches");
      for (var j = 0; j < 12; j++) {
        var b = deg(j * 30 + 15);
        var nl = document.createElementNS(NS, "line");
        nl.setAttribute("x1", (291 * Math.cos(b)).toFixed(2));
        nl.setAttribute("y1", (291 * Math.sin(b)).toFixed(2));
        nl.setAttribute("x2", (309 * Math.cos(b)).toFixed(2));
        nl.setAttribute("y2", (309 * Math.sin(b)).toFixed(2));
        nl.setAttribute("stroke", "#141516");
        nl.setAttribute("stroke-width", "4");
        notches.appendChild(nl);
      }

      // arc arrow r 410 around (540, 900), counter-clockwise from -35deg to -155deg
      var R = 410, CX = 540, CY = 900, A0 = deg(-35), A1 = deg(-155);
      var p0 = [CX + R * Math.cos(A0), CY + R * Math.sin(A0)];
      var p1 = [CX + R * Math.cos(A1), CY + R * Math.sin(A1)];
      var arc = el("arc");
      arc.setAttribute("d", "M " + p0[0].toFixed(2) + " " + p0[1].toFixed(2) +
        " A " + R + " " + R + " 0 0 0 " + p1[0].toFixed(2) + " " + p1[1].toFixed(2));
      var ARC_LEN = R * deg(120);
      arc.setAttribute("stroke-dasharray", ARC_LEN.toFixed(2) + " " + ARC_LEN.toFixed(2));
      var dir = [Math.sin(A1), -Math.cos(A1)]; // CCW tangent
      var nrm = [-dir[1], dir[0]];
      var tip = [p1[0] + 8 * dir[0], p1[1] + 8 * dir[1]];
      var base = [tip[0] - 30 * dir[0], tip[1] - 30 * dir[1]];
      el("arrowhead").setAttribute("points",
        (base[0] + 20 * nrm[0]).toFixed(2) + "," + (base[1] + 20 * nrm[1]).toFixed(2) + " " +
        tip[0].toFixed(2) + "," + tip[1].toFixed(2) + " " +
        (base[0] - 20 * nrm[0]).toFixed(2) + "," + (base[1] - 20 * nrm[1]).toFixed(2));

      var OUT_LEN = 2 * Math.PI * 362, IN_LEN = 2 * Math.PI * 312;
      el("head-outer").setAttribute("stroke-dasharray", OUT_LEN.toFixed(2) + " " + OUT_LEN.toFixed(2));
      el("head-inner").setAttribute("stroke-dasharray", IN_LEN.toFixed(2) + " " + IN_LEN.toFixed(2));
      var CHECK_LEN = 60;
      el("check-mark").setAttribute("stroke-dasharray", CHECK_LEN + " " + CHECK_LEN);

      // --- timeline ---
      var tl = gsap.timeline({ paused: true });

      // slow push-in around the spine centre (scale 1 at the handoff)
      tl.fromTo(el("stage"), { scale: 1 }, { scale: 1.04, duration: 7.73, ease: "sine.inOut" }, 0);

      // Scene 1 (0.0-2.7): timer ring thickens into the socket ring; wrench head + handle draw out
      tl.fromTo(el("ring"), { attr: { "stroke-width": 8 } }, { attr: { "stroke-width": 20 }, duration: 0.75, ease: "power2.inOut" }, 0.15);
      tl.fromTo(el("notches"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.55);
      tl.fromTo(el("head-outer"), { attr: { "stroke-dashoffset": OUT_LEN } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.9, ease: "power2.inOut" }, 0.4);
      tl.fromTo(el("head-inner"), { attr: { "stroke-dashoffset": -IN_LEN } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.9, ease: "power2.inOut" }, 0.5);
      tl.fromTo(el("head-fill"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.75);
      tl.fromTo(el("knurl"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.0);
      tl.fromTo(el("handle-clip-rect"), { attr: { width: 0 } }, { attr: { width: 330 }, duration: 1.1, ease: "power3.out" }, 1.0);
      tl.fromTo(el("grip"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.8);

      // step 4 copy on "استخدم الأدوات المناسبة" (0.6)
      tl.fromTo(el("disc"), { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.6);
      tl.fromTo(el("num4"), { opacity: 1, y: 0 }, { opacity: 1, y: 0, duration: 0.01 }, 0);
      tl.fromTo(el("num5"), { opacity: 0, y: 40 }, { opacity: 0, y: 40, duration: 0.01 }, 0);
      tl.fromTo(el("t4"), { opacity: 0, y: 24, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 0.7);
      tl.fromTo(el("t5"), { opacity: 0, y: 24, filter: "blur(6px)" }, { opacity: 0, y: 24, filter: "blur(6px)", duration: 0.01 }, 0);

      // Scene 2 (2.8-4.6): the turn - 120deg CCW in two ratchet strokes; bolt turns with it
      tl.fromTo(el("rotor"), { rotation: 0 }, { rotation: -60, duration: 0.72, ease: "power2.inOut" }, 2.8);
      tl.to(el("rotor"), { rotation: -120, duration: 0.75, ease: "power2.inOut" }, 3.72);
      tl.fromTo(el("arc"), { attr: { "stroke-dashoffset": ARC_LEN } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.6, ease: "power2.inOut" }, 2.85);
      tl.fromTo(el("arrowhead"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 4.3);
      // part comes loose: the bolt drawing lifts slightly toward camera
      tl.fromTo(el("crop"), { scale: 1 }, { scale: 1.06, duration: 0.7, ease: "power2.out" }, 4.25);
      // check on "بعناية" (4.0)
      tl.fromTo(el("check"), { opacity: 0, scale: 0.6, svgOrigin: "540 1450" }, { opacity: 1, scale: 1, svgOrigin: "540 1450", duration: 0.4, ease: "power3.out" }, 4.0);
      tl.fromTo(el("check-mark"), { attr: { "stroke-dashoffset": CHECK_LEN } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.35, ease: "power2.out" }, 4.12);

      // Scene 3 (4.7-7.2): step 5 replaces the top text; arrow retires
      tl.to(el("t4"), { opacity: 0, y: -22, filter: "blur(6px)", duration: 0.35, ease: "power2.in" }, 4.7);
      tl.to(el("num4"), { opacity: 0, y: -40, duration: 0.35, ease: "power2.in" }, 4.7);
      tl.to(el("num5"), { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 4.95);
      tl.to(el("t5"), { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, 4.95);
      tl.to([el("arc"), el("arrowhead")], { opacity: 0, duration: 0.45, ease: "power2.inOut" }, 4.8);

      // charcoal cloth band enters from the left, wipes across the bolt (power1.in), then
      // Scene 4 (6.9-7.73) continues at constant speed so it is still moving at the cut.
      // band centre x: -1500 (off-screen) -> -560 -> 165 (covers x 0-1080 incl. the highlight from ~7.61s)
      tl.fromTo(el("band"), { x: -1500, rotation: -14 }, { x: -560, rotation: -14, duration: 2.15, ease: "power1.in" }, 4.75);
      tl.to(el("band"), { x: 165, rotation: -14, duration: 0.83, ease: "none" }, 6.9);

      window.__timelines = window.__timelines || {};
      window.__timelines["07-usage-2"] = tl;
    })();
  </script>
