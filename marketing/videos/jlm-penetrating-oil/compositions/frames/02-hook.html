  <div id="root" data-composition-id="02-hook" data-start="0" data-duration="5.16" data-width="1080" data-height="1920">

            <polyline points="184,452 200,444 196,436 214,431 211,423 229,419 233,410 248,408 252,399 268,395" fill="none" stroke="#F1F0EC" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />

  <script>
    (function () {
      var ID = "02-hook";
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      var $ = function (id) { return root.querySelector('[id="' + ID + "-" + id + '"]'); };
      var SVGNS = "http://www.w3.org/2000/svg";

      var lens = $("lens");
      var crop = $("crop");
      var tint = $("tint");
      var rustSvg = $("rustsvg");
      var specks = $("specks");
      var crack = $("crack");
      var wOrbit = $("wrench-orbit");
      var wRot = $("wrench-rot");
      var l1 = $("l1"), l2 = $("l2"), l3 = $("l3");
      var w1 = l1.querySelectorAll('[data-hk="w"]');
      var w2 = l2.querySelectorAll('[data-hk="w"]');
      var w3 = l3.querySelectorAll('[data-hk="w"]');

      // ---- seeded rust specks (crop-native coords, 660x670) ----
      var seed = 20240502;
      function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
      function inPoly(x, y, poly) {
        var inside = false;
        for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
          var xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
          if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
        }
        return inside;
      }
      var NUT = [[367, 122], [492, 155], [565, 265], [472, 407], [350, 372], [272, 260]];
      var HEAD = [[25, 157], [124, 90], [231, 115], [250, 250], [110, 315], [50, 300]];
      var COLS = ["#8A4B22", "#B5652A", "#7A3F1B", "#B5652A"];
      function scatter(poly, n, bx, by, bw, bh) {
        var made = 0, guard = 0;
        while (made < n && guard < 4000) {
          guard++;
          var x = bx + rnd() * bw, y = by + rnd() * bh;
          if (!inPoly(x, y, poly)) continue;
          var r = 1.6 + Math.pow(rnd(), 2.2) * 7.5;
          var e = document.createElementNS(SVGNS, "ellipse");
          e.setAttribute("cx", x.toFixed(1));
          e.setAttribute("cy", y.toFixed(1));
          e.setAttribute("rx", r.toFixed(2));
          e.setAttribute("ry", (r * (0.55 + rnd() * 0.5)).toFixed(2));
          e.setAttribute("transform", "rotate(" + (rnd() * 180).toFixed(0) + " " + x.toFixed(1) + " " + y.toFixed(1) + ")");
          e.setAttribute("fill", COLS[Math.floor(rnd() * COLS.length)]);
          e.setAttribute("opacity", (0.55 + rnd() * 0.4).toFixed(2));
          specks.appendChild(e);
          made++;
        }
      }
      scatter(NUT, 46, 272, 122, 293, 285);
      scatter(HEAD, 34, 25, 90, 225, 225);
      // a few heavier crust blobs along the top edges
      scatter([[367, 122], [492, 155], [520, 200], [380, 165]], 10, 367, 122, 153, 78);
      scatter([[124, 90], [231, 115], [240, 160], [130, 135]], 8, 124, 90, 116, 70);

      // ---- radial dissolve from the nut outward (crop-container px) ----
      var NUT_X = 408 * (940 / 660), NUT_Y = 285 * (954.3 / 670);
      var dis = { r: -140 };
      function applyDissolve() {
        var m = "radial-gradient(circle at " + NUT_X.toFixed(1) + "px " + NUT_Y.toFixed(1) + "px, rgba(0,0,0,0) " + dis.r.toFixed(1) + "px, #000 " + (dis.r + 140).toFixed(1) + "px)";
        tint.style.webkitMaskImage = m; tint.style.maskImage = m;
        rustSvg.style.webkitMaskImage = m; rustSvg.style.maskImage = m;
      }
      applyDissolve();

      var iris = { r: 0 };
      function applyIris() { lens.style.clipPath = "circle(" + iris.r.toFixed(2) + "px at 540px 900px)"; }
      applyIris();

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–0.7): iris in + spiral counter-rotation
      tl.fromTo(iris, { r: 0 }, { r: 470, duration: 0.7, ease: "power2.out", onUpdate: applyIris }, 0);
      tl.fromTo(crop, { rotation: -12 }, { rotation: 0, duration: 0.7, ease: "power2.out" }, 0);

      // Scene 2 (0.2–2.3): question line, per word on VO cues
      var inWord = function (el, t, dur) {
        tl.fromTo(el, { opacity: 0, y: 26, filter: "blur(10px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: dur || 0.45, ease: "power3.out" }, t);
      };
      inWord(w1[0], 0.2);
      inWord(w1[1], 0.62);
      inWord(w1[2], 1.08);
      tl.fromTo(w1[3], { opacity: 0, y: 26, scale: 1.18, filter: "blur(10px)" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, 1.6);
      // rust specks pulse brighter once on "الصدأ"
      tl.fromTo(specks, { filter: "brightness(1) saturate(1)" },
        { filter: "brightness(1.75) saturate(1.35)", duration: 0.18, ease: "power2.out" }, 1.6);
      tl.to(specks, { filter: "brightness(1) saturate(1)", duration: 0.5, ease: "power2.inOut" }, 1.78);

      // Scene 3 (2.4–3.4): wrench arcs onto the nut, strains, shakes; crack flash
      tl.fromTo(wOrbit, { rotation: 72, opacity: 0 }, { rotation: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, 2.4);
      tl.fromTo(wRot, { rotation: 55 }, { rotation: 65, duration: 0.2, ease: "power1.inOut" }, 2.8);
      tl.to(wRot, { rotation: 55, duration: 0.07, ease: "power2.in" }, 3.0);
      var jit = [57.4, 52.6, 57.0, 53.0, 56.4, 53.6];
      for (var j = 0; j < jit.length; j++) {
        tl.to(wRot, { rotation: jit[j], duration: 0.045, ease: "sine.inOut" }, 3.07 + j * 0.045);
      }
      tl.to(wRot, { rotation: 55, duration: 0.05, ease: "sine.out" }, 3.07 + jit.length * 0.045);
      // crack flash on the bolt shank at "تكسره"
      tl.fromTo(crack, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, 3.0);
      tl.to(crack, { opacity: 0, duration: 0.32, ease: "power2.in" }, 3.1);
      // lower line «قبل أن تكسره…»
      inWord(w2[0], 2.4, 0.4);
      inWord(w2[1], 2.7, 0.35);
      inWord(w2[2], 3.0, 0.4);

      // Scene 4 (3.5–4.5): wrench arcs away; line swaps to «هناك حلّ أذكى»; rust dissolves
      tl.to(wOrbit, { rotation: -62, opacity: 0, duration: 0.45, ease: "power2.in" }, 3.5);
      tl.to(l2, { opacity: 0, y: -14, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, 3.36);
      inWord(w3[0], 3.5, 0.42);
      inWord(w3[1], 3.9, 0.42);
      tl.fromTo(w3[2], { opacity: 0, y: 22, scale: 1.22, filter: "blur(10px)" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 4.2);
      tl.fromTo(dis, { r: -140 }, { r: 1050, duration: 0.5, ease: "power1.in", onUpdate: applyDissolve }, 3.9);
      tl.set([tint, rustSvg], { opacity: 0 }, 4.4);

      // Scene 5 (4.5–5.16): texts clear; clean CROP + ring C hold (handoff_out)
      tl.to([l1, l3], { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power2.inOut" }, 4.6);
      tl.set([l1, l2, l3, wOrbit, crack], { opacity: 0 }, 5.0);
      tl.set(crop, { rotation: 0 }, 5.0);
      tl.set({}, {}, 5.16);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
