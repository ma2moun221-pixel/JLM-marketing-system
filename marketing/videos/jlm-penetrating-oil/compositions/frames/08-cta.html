      // ---- Scene 1 (0.0–0.6s): wipe band exits right, ring draws, can arcs in ----
      tl.fromTo($("band-mover"), { x: 0 }, { x: 1590, duration: 0.6, ease: "power1.in" }, 0);

      // silver hairline ring: slow rotation for the whole frame (the only motion in the hold)
      tl.fromTo($("hairline"), { rotation: 0, svgOrigin: "540 800" }, { rotation: 32, svgOrigin: "540 800", duration: DUR, ease: "none" }, 0);

      tl.fromTo($("disc"), { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 0.05);
      tl.fromTo($("ring"), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.75, ease: "power2.inOut" }, 0.02);

      // circular arc: arm pivots about (900,1250) from -50deg -> 0 (start ≈ (331,1243), lower-left);
      // the can counter-rotates +40 -> 0 so its net tilt runs -10deg -> 0deg.

      tl.fromTo($("can"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 0.08);
      tl.fromTo($("shadow"), { opacity: 0, scaleX: 0.6 }, { opacity: 1, scaleX: 1, duration: 0.6, ease: "power2.out" }, 0.5);

      // ---- Scene 2 (0.2–2.4s): logo settles; title lands on "JLM" ----
      tl.fromTo($("logo"), { opacity: 0, y: -26, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: "power3.out" }, 0.25);
      tl.fromTo($("t1"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.3);
      tl.fromTo($("t2"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.35);
      tl.fromTo($("t3"), { opacity: 0, y: 14, scale: 0.72 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 1.6);

      // ---- Scene 3 (2.7–5.4s): CTA line, then the store pill pops and is pressed on "متجرنا" ----

      tl.fromTo($("a2"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 3.25);

      tl.fromTo($("pill"), { opacity: 0, scale: 0.62 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 3.72);

      var PRESS_START = 4.32, PRESS_DUR = 0.16, RELEASE_START = PRESS_START + PRESS_DUR, RELEASE_DUR = 0.62;
      tl.to($("pill"), { scale: 0.92, boxShadow: "0 4px 10px rgba(250, 184, 23, 0.16)", duration: PRESS_DUR, ease: "power1.in" }, PRESS_START);
      tl.to($("pill"), { scale: 1, boxShadow: "0 18px 44px rgba(250, 184, 23, 0.26)", duration: RELEASE_DUR, ease: "back.out(1.6)" }, RELEASE_START);
      tl.fromTo($("burst"), { scale: 1, opacity: 0 }, { scale: 3, opacity: 0.6, duration: 0.5, ease: "power2.out" }, RELEASE_START);
      tl.to($("burst"), { opacity: 0, duration: 0.6, ease: "power2.in" }, RELEASE_START + 0.5);
      tl.fromTo($("bgglow"), { opacity: 0 }, { opacity: 0.14, duration: 0.9, ease: "power2.out" }, RELEASE_START);

      // ---- Scene 4 (5.6–7.6s): delivery row + self-drawing truck ----

      var tk = ["tk1", "tk2", "tk3", "tk4", "tk5", "tk6"];
