            <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path>

    <!-- scene 4: yellow wipe band, 14° leading edge, right → left -->
    <div id="05-audience-wipe" class="clip 05-audience-layer" data-start="0" data-duration="11.16" data-track-index="2">
      <div id="05-audience-band" class="05-audience-band"></div>
    </div>

    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        var P = "05-audience-";
        var $ = function (id) { return document.getElementById(P + id); };
        var D2R = Math.PI / 180;
        var HX = 540, HY = 760; // hub centre (handoff_in)

        // deterministic gear outline (no randomness)
        function gearPath(cx, cy, ro, ri, n) {
          var step = (Math.PI * 2) / n, d = "";
          for (var k = 0; k < n; k++) {
            var b = k * step - Math.PI / 2;
            var pts = [[ri, b - 0.27 * step], [ro, b - 0.15 * step], [ro, b + 0.15 * step], [ri, b + 0.27 * step]];
            for (var j = 0; j < 4; j++) {
              var x = (cx + Math.cos(pts[j][1]) * pts[j][0]).toFixed(3);
              var y = (cy + Math.sin(pts[j][1]) * pts[j][0]).toFixed(3);
              d += (k === 0 && j === 0 ? "M" : "L") + x + " " + y + " ";
            }
          }
          return d + "Z";
        }
        $("icon-gear-a").setAttribute("d", gearPath(9, 9, 6.6, 4.9, 8));
        $("icon-gear-b").setAttribute("d", gearPath(12, 12, 9.6, 7.2, 8));

        var tl = gsap.timeline({ paused: true });

        // ---------- Scene 1 (0.0–1.5): hub decelerates, wrench draws, headline lands ----------
        // handoff_in: rotation 0°, spinning clockwise at 90°/s. Ease f(u)=1.5u−0.5u³ over 1.0 s
        // for 60° → initial speed 1.5·60 = 90°/s, final speed 0, rests flat-top again.
        var hubSpin = $("hub-spin");
        tl.fromTo(hubSpin, { rotation: 0 }, {
          rotation: 60, duration: 1.0,
          ease: function (u) { return 1.5 * u - 0.5 * u * u * u; }
        }, 0);
        tl.fromTo($("wrench"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" }, 0.35);
        tl.fromTo($("headline"), { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.2);

        // gentle camera push around the hub (starts at scale 1 → handoff_in untouched)
        tl.fromTo($("cam"), { scale: 1, transformOrigin: "540px 760px" },
          { scale: 1.035, transformOrigin: "540px 760px", duration: 9.3, ease: "sine.inOut" }, 1.0);

        // orbit ring draws on from 12 o'clock as the first audience arrives
        tl.fromTo($("orbit"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.3, ease: "power2.inOut" }, 1.45);

        // hub tick (soft pulse when something connects)
        var hub = $("hub");
        function tick(at) {
          tl.fromTo(hub, { scale: 1 }, { scale: 1.06, duration: 0.12, ease: "power2.out", immediateRender: false }, at);
          tl.fromTo(hub, { scale: 1.06 }, { scale: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, at + 0.12);
        }

        // ---------- Scene 2 (1.6–5.6): three audience nodes orbit in on ring r=330 ----------
        // slots (screen angle, clockwise from 3 o'clock): 2 o'clock = −30°, 6 = 90°, 10 = 210°
        var R = 330;
        var nodes = [
          { at: 1.6, slot: -30 },
          { at: 2.8, slot: 90 },
          { at: 3.9, slot: 210 }
        ];
        nodes.forEach(function (n, i) {
          var el = $("node-" + i), body = $("node-body-" + i), label = $("label-" + i), line = $("line-" + i);
          var p = { a: n.slot - 60, r: 420 };
          var place = function () {
            gsap.set(el, { x: HX + Math.cos(p.a * D2R) * p.r, y: HY + Math.sin(p.a * D2R) * p.r });
          };
          place();
          // orbit in clockwise along the ring (travel), landing at its slot
          tl.fromTo(p, { a: n.slot - 60, r: 420 }, { a: n.slot, r: R, duration: 1.0, ease: "power3.out", onUpdate: place }, n.at);
          // 3D flip in place (orbit-3d-entry) + fade
          tl.fromTo(body, { opacity: 0, scale: 0.45, rotationY: 75, transformPerspective: 900 },
            { opacity: 1, scale: 1, rotationY: 0, transformPerspective: 900, duration: 0.9, ease: "power3.out" }, n.at);
          tl.fromTo(label, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, n.at + 0.35);
          // yellow hairline draws OUTWARD from the hub edge to the node edge
          var c = Math.cos(n.slot * D2R), s = Math.sin(n.slot * D2R);
          line.setAttribute("x1", (HX + c * 141).toFixed(2));
          line.setAttribute("y1", (HY + s * 141).toFixed(2));
          line.setAttribute("x2", (HX + c * (R - 81)).toFixed(2));
          line.setAttribute("y2", (HY + s * (R - 81)).toFixed(2));
          tl.fromTo(line, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, n.at + 0.55);
          tick(n.at + 0.95);
        });

        // ---------- Scene 3 (6.1–10.2): ring turns 60°, applications arc out of the hub ----------
        var ROT_AT = 6.1, ROT_DUR = 1.25;
        tl.fromTo($("ring"), { rotation: 0, transformOrigin: "540px 760px" },
          { rotation: 60, transformOrigin: "540px 760px", duration: ROT_DUR, ease: "power2.inOut", immediateRender: false }, ROT_AT);
        // keep every node upright while the ring turns
        tl.fromTo([$("node-body-0"), $("node-body-1"), $("node-body-2")], { rotation: 0 },
          { rotation: -60, duration: ROT_DUR, ease: "power2.inOut", immediateRender: false }, ROT_AT);
        // headline rises to make room for the top node
        tl.fromTo($("headline"), { y: 0 }, { y: -105, duration: ROT_DUR, ease: "power2.inOut", immediateRender: false }, ROT_AT);

        tl.fromTo($("sub"), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 6.15);

        // chips: fixed widths, RTL row centred, centre y 1450
        var CY = 1450, GAP = 20;
        var chips = [
          { at: 7.4, w: 210 },
          { at: 8.0, w: 270 },
          { at: 9.0, w: 410 }
        ];
        var total = chips.reduce(function (a, c) { return a + c.w; }, 0) + GAP * (chips.length - 1);
        var right = 540 + total / 2;
        chips.forEach(function (c, i) {
          var el = $("chip-" + i);
          var left = right - c.w;
          right = left - GAP;
          el.style.left = left + "px";
          el.style.width = c.w + "px";
          var cx = left + c.w / 2;
          var dx = cx - HX, dy = CY - HY;
          var r1 = Math.sqrt(dx * dx + dy * dy);
          var a1 = Math.atan2(dy, dx) / D2R;
          var a0 = a1 + 50, r0 = 150; // leave the hub edge, sweep counter-clockwise onto its slot
          var p = { u: 0 };
          var place = function () {
            var e = 1 - Math.pow(1 - p.u, 3);
            var a = (a0 + (a1 - a0) * e) * D2R, r = r0 + (r1 - r0) * e;
            gsap.set(el, { x: HX + Math.cos(a) * r - cx, y: HY + Math.sin(a) * r - CY });
          };
          place();
          tl.fromTo(p, { u: 0 }, { u: 1, duration: 0.85, ease: "none", onUpdate: place }, c.at);
          tl.fromTo(el, { opacity: 0, scale: 0.35 }, { opacity: 1, scale: 1, duration: 0.85, ease: "power3.out" }, c.at);
          tick(c.at);
        });

        // ---------- Scene 4 (10.3–11.16): yellow band wipes right → left ----------
        // skewX −14° → 14° slanted leading edge; band covers x 0–1080 from 11.1 s and is still
        // travelling left at the cut (handoff_out).
        tl.fromTo($("band"), { x: 1340, skewX: -14 }, { x: -440, skewX: -14, duration: 0.86, ease: "sine.in" }, 10.3);

        window.__timelines = window.__timelines || {};
        window.__timelines["05-audience"] = tl;
      })();
    </script>

</template>
