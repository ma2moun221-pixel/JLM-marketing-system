  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var $ = function (id) { return document.getElementById("03-product-" + id); };
      var tl = gsap.timeline({ paused: true });

      // ---- ease helpers (pure functions of progress — seek-safe) ----
      var e3io = function (p) { return p < 0.5 ? 8 * p * p * p * p : 1 - Math.pow(-2 * p + 2, 4) / 2; }; // power3.inOut
      var e2in = function (p) { return p * p * p; };                                                     // power2.in
      var arcE = function (base) { return function (p) { return Math.sin(Math.PI * base(p)); }; };      // out-and-back
      var logE = function (a, b, base) {                                                                 // exponential scale interp
        return function (p) { return (a * Math.pow(b / a, base(p)) - a) / (b - a); };
      };

      // ---- shared geometry ----
      var S_CROP = 1.42424, S_HERO = 1150 / 2400, S_DIVE_END = 12;
      var A_CROP = { x: 470, y: 1585 }, A_HERO = { x: 421, y: 1200 }, A_DROP = { x: 715, y: 1285 };

      // ===== handoff_in: CAN@CROP inside circle C, ring C stroke 8 yellow =====
      tl.set($("cam0"), { x: 0, y: 0 }, 0);
      tl.set($("cam1"), { x: 540, y: 900, rotation: 0, scale: S_CROP, transformOrigin: "0 0" }, 0);
      tl.set($("cam2"), { x: -A_CROP.x, y: -A_CROP.y }, 0);

      // ===== Scene 1 (0.0–2.4): cut-out reveal + spiral pull-back =====
      var D1 = 2.4;
      tl.fromTo($("mask"), { clipPath: "circle(470px at 540px 900px)" },
        { clipPath: "circle(1400px at 540px 900px)", duration: 2.0, ease: "power3.inOut" }, 0);
      tl.fromTo($("ring"), { attr: { r: 470 }, opacity: 1 },
        { attr: { r: 840 }, opacity: 0, duration: 1.5, ease: "power2.inOut" }, 0);
      tl.to($("cam1"), { scale: S_HERO, duration: D1, ease: logE(S_CROP, S_HERO, e3io) }, 0);
      tl.to($("cam1"), { x: 540, y: 960, duration: D1, ease: e3io }, 0);
      tl.to($("cam1"), { rotation: -8, duration: D1, ease: arcE(e3io) }, 0);
      tl.to($("cam0"), { x: -150, y: -70, duration: D1, ease: arcE(e3io) }, 0);
      tl.to($("cam2"), { x: -A_HERO.x, y: -A_HERO.y, duration: D1, ease: e3io }, 0);
      tl.fromTo($("shadow"), { opacity: 0, scaleX: 0.6 }, { opacity: 1, scaleX: 1, duration: 1.0, ease: "power2.out" }, 1.4);
      tl.fromTo($("glow"), { opacity: 0 }, { opacity: 0.45, duration: 0.8, ease: "power2.out" }, 1.9);

      // title on "JLM" (1.6s)
      tl.fromTo([$("t1"), $("t2")], { y: 46, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: "power3.out", stagger: 0.16 }, 1.6);
      tl.fromTo($("latin"), { opacity: 0, letterSpacing: "0.42em", y: 10 },
        { opacity: 1, letterSpacing: "0.06em", y: 0, duration: 0.8, ease: "power3.out" }, 1.95);

      // ===== Scene 2 (2.6–6.6): orbit ring + role line =====
      tl.fromTo($("ob-line"), { strokeDashoffset: 1000 }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.in" }, 2.6);
      tl.fromTo($("of-line"), { strokeDashoffset: 1000 }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 3.15);
      tl.fromTo([$("ob-dash"), $("of-dash")], { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 3.5);
      // slow turntable rotation (dash pattern flows around the loop; both halves share the offset)
      tl.fromTo([$("ob-dash"), $("of-dash")], { strokeDashoffset: 0 }, { strokeDashoffset: -1500, duration: 11.25 - 3.5, ease: "none" }, 3.5);

      var word = function (el, at) {
        tl.fromTo(el, { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, at);
      };
      word($("a1"), 2.6); word($("a2"), 3.15); word($("a3"), 3.9); word($("a4"), 4.25);
      word($("b1"), 4.9); word($("b2"), 5.3);

      // + MoS2 tag pointing at the drop on the label
      tl.fromTo($("tagdot"), { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 5.8);
      tl.fromTo($("tagline"), { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, 5.9);
      tl.fromTo($("tagtext"), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 6.2);

      // ===== Scene 3 (7.0–11.0): benefits orbit in; benefit line assembles =====
      tl.to([$("lineA"), $("lineB")], { opacity: 0, y: -14, duration: 0.3, ease: "power2.in" }, 7.0);
      word($("c1"), 7.05); word($("c2"), 7.6); word($("c3"), 8.3); word($("c4"), 9.1); word($("c5"), 9.35);
      tl.fromTo($("easy"), { y: 26, opacity: 0, scale: 0.9 }, { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 10.9);

      var O = { x: 540, y: 960 };
      var orbitIn = function (n, fx, fy, at) {
        var dx = fx - O.x, dy = fy - O.y, K = 1.55, SWEEP = 75, DUR = 1.1;
        tl.fromTo($("piv" + n), { rotation: -SWEEP }, { rotation: 0, duration: DUR, ease: "power3.out" }, at);
        tl.fromTo($("arm" + n), { x: dx * K, y: dy * K }, { x: dx, y: dy, duration: DUR, ease: "power3.out" }, at);
        tl.fromTo($("ctr" + n), { rotation: SWEEP, scale: 0.8 }, { rotation: 0, scale: 1, duration: DUR, ease: "power3.out" }, at);
        tl.fromTo($("ctr" + n), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.out" }, at);
      };
      orbitIn(1, 768, 700, 7.6);   // الصدأ — right
      orbitIn(2, 312, 980, 8.3);   // التآكل — left
      orbitIn(3, 1046, 1262, 9.1); // الأجزاء الملتصقة — right

      // ===== Scene 4 (11.0–11.95): zoom-through into the +MoS2 drop =====
      var T4 = 11.0, D4 = 0.75;
      tl.to([$("title"), $("latin"), $("lineC"), $("tagsvg"), $("tagtext"), $("orbitback"), $("orbitfront"),
             $("ctr1"), $("ctr2"), $("ctr3"), $("shadow"), $("glow")],
        { opacity: 0, duration: 0.25, ease: "power1.in" }, T4);
      tl.to($("cam1"), { scale: S_DIVE_END, duration: D4, ease: logE(S_HERO, S_DIVE_END, e2in) }, T4);
      tl.to($("cam1"), { x: 540, y: 900, duration: D4, ease: e2in }, T4);
      tl.to($("cam1"), { rotation: 6, duration: D4, ease: e2in }, T4);
      tl.to($("cam0"), { x: 90, y: -50, duration: D4, ease: arcE(function (p) { return p * p; }) }, T4);
      tl.to($("cam2"), { x: -A_DROP.x, y: -A_DROP.y, duration: D4, ease: e2in }, T4);
      // motion-blur streak at wrapper level (depth push: symmetric blur), peaks with speed at the end of the dive
      tl.set($("blur"), { filter: "blur(0px)" }, T4 + 0.1);
      tl.fromTo($("blur"), { filter: "blur(0px)" }, { filter: "blur(16px)", duration: D4 - 0.1, ease: "power2.in", immediateRender: false }, T4 + 0.1);
      tl.fromTo($("disc"), { attr: { r: 0 } }, { attr: { r: 1200 }, duration: 0.38, ease: "power2.in" }, T4 + 0.37);
      // handoff_out: solid label blue for the last 0.2s
      tl.fromTo($("blue"), { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, 11.749);
      tl.set({}, {}, 11.95);

      window.__timelines = window.__timelines || {};
      window.__timelines["03-product"] = tl;
    })();
  </script>
