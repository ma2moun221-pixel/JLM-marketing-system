<template>
<style>
@font-face{font-family:"Albert Sans";font-weight:100 900;font-display:block;src:url("assets/fonts/AlbertSans-Regular.ttf") format("truetype");}
@font-face{font-family:"HNA";font-weight:700;font-display:block;src:url("assets/fonts/HelveticaNeueLTArabic-Bold.ttf") format("truetype");}
@font-face{font-family:"HNA";font-weight:400;font-display:block;src:url("assets/fonts/HelveticaNeueLTArabic-Regular.ttf") format("truetype");}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;}
#story-root{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#161718;}
.full{position:absolute;left:0;top:0;width:1080px;height:1920px;}
.ar{font-family:"HNA";font-weight:700;color:#F1F0EC;direction:rtl;text-align:center;position:absolute;left:0;width:1080px;text-shadow:0 2px 18px rgba(0,0,0,.55);}
.y{color:#FAB817;}
.lat{font-family:"Albert Sans";font-weight:800;direction:ltr;unicode-bidi:isolate;}
/* the real photo, moved like a slow hand-held camera */
#cam{transform-origin:480px 990px;}
#photo{position:absolute;left:0;top:0;width:1080px;height:1920px;}
/* light sweep on the can only (mask cut from the photo) */
#sheen{-webkit-mask-image:url("assets/gen/can_mask.png");mask-image:url("assets/gen/can_mask.png");-webkit-mask-size:100% 100%;mask-size:100% 100%;mix-blend-mode:screen;overflow:hidden;}
#sheen i{position:absolute;top:560px;left:150px;width:150px;height:860px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55) 50%,rgba(255,255,255,0));transform:skewX(-14deg);opacity:0;}
.glow{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,244,220,.9),rgba(255,236,200,.35) 45%,rgba(255,230,190,0));mix-blend-mode:screen;}
.star{position:absolute;mix-blend-mode:screen;}
.star b{position:absolute;left:50%;top:50%;background:linear-gradient(90deg,rgba(255,246,225,0),rgba(255,246,225,.85),rgba(255,246,225,0));}
.mote{position:absolute;border-radius:50%;}
#shade-top{background:linear-gradient(180deg,rgba(14,15,16,.78) 0%,rgba(14,15,16,.5) 18%,rgba(14,15,16,0) 34%);}
#shade-bot{background:linear-gradient(0deg,rgba(14,15,16,.82) 0%,rgba(14,15,16,.55) 20%,rgba(14,15,16,0) 38%);}
#logo{position:absolute;right:64px;top:200px;width:190px;}
.chip{display:inline-block;margin:0 7px;padding:10px 26px 14px;border-radius:40px;border:2px solid #FAB817;font-family:"HNA";font-weight:700;font-size:36px;color:#F1F0EC;background:rgba(20,21,22,.72);}
#panel{position:absolute;left:100px;top:1385px;width:880px;height:298px;border-radius:40px;background:rgba(20,21,22,.74);border:2px solid rgba(250,184,23,.55);box-shadow:0 20px 60px rgba(0,0,0,.45);}
#pill{position:absolute;left:300px;top:1505px;width:480px;height:92px;border-radius:46px;background:#FAB817;color:#252729;font-family:"Albert Sans";font-weight:800;font-size:52px;display:flex;align-items:center;justify-content:center;}
#truck path,#truck circle{fill:none;stroke:#FAB817;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;}
</style>
<div id="story-root" data-composition-id="story" data-width="1080" data-height="1920">
 <div id="stage" class="clip full" data-start="0" data-duration="10" data-track-index="1">

  <div id="cam" class="full">
   <img id="photo" src="assets/photo.jpg" alt="" />
   <div id="glints" class="full"></div>
   <div id="sheen" class="full"><i id="sh1"></i><i id="sh2"></i></div>
  </div>
  <div id="motes" class="full"></div>
  <div id="shade-top" class="full"></div>
  <div id="shade-bot" class="full"></div>

  <img id="logo" src="assets/logo_on_dark.png" alt="" />

  <!-- headlines (top, over the dark ceiling) -->
  <div class="ar h1" style="top:345px;font-size:80px">هواء <span class="y">منعش</span> في سيارتك</div>
  <div class="ar h1" style="top:462px;font-size:56px;font-weight:400">برائحة <span class="y">التفاح</span></div>

  <div class="ar h2" style="top:345px;font-size:74px">يزيل <span class="y">الروائح المزعجة</span></div>
  <div class="ar h2" style="top:458px;font-size:52px;font-weight:400">من المكيّف ونظام التدفئة</div>

  <div class="ar h3" style="top:350px;font-size:76px"><span class="lat">JLM <span class="y">Air Refresh</span></span></div>
  <div class="ar h3" style="top:462px;font-size:52px;font-weight:400">برائحة التفاح</div>

  <!-- benefits, from the label -->
  <div class="ar" id="chips" style="top:1450px;line-height:2.3">
   <span class="chip">ينظّف</span><span class="chip">يعادل الروائح</span><span class="chip">سهل الاستعمال</span>
  </div>

  <!-- CTA -->
  <div id="panel"></div>
  <div class="ar" id="a1" style="top:1398px;font-size:52px"><span class="y">اطلبه الآن</span> من خلال</div>
  <div id="pill" dir="ltr">jlmstore.com</div>
  <div class="ar" id="d1" style="top:1612px;font-size:40px;display:flex;justify-content:center;align-items:center;gap:16px;direction:rtl">
   <span>مع توفّر <span class="y">خدمة التوصيل</span></span>
   <svg id="truck" viewBox="0 0 100 52" width="80" height="42" style="position:relative;overflow:visible"><path pathLength="1" d="M34 38 V8 H82 V38 Z"></path><path pathLength="1" d="M34 16 H20 L8 29 V38 H34"></path><circle pathLength="1" cx="21" cy="42" r="6.5"></circle><circle pathLength="1" cx="68" cy="42" r="6.5"></circle></svg>
  </div>
 </div>
</div>
<script src="assets/vendor/gsap.min.js"></script>
<script>
(function(){
 // seeded random: the same film every render
 var seed = 11;
 function rnd(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

 // ceiling spot lights found in the photo (scripts/prepare_photo.py → lights.json), story px: x, y, size
 var LIGHTS = [[807,251,24],[869,725,26],[89,495,19],[717,372,12],[307,372,11],[658,447,9],[329,445,9],[618,494,7],[345,493,7]];
 var STARS = [0,3,4];
 var gl = document.getElementById("glints");
 LIGHTS.forEach(function(l, i){
  var d = document.createElement("div"), s = l[2] * 3.2;
  d.className = "glow";
  d.style.cssText = "left:" + (l[0] - s / 2) + "px;top:" + (l[1] - s / 2) + "px;width:" + s + "px;height:" + s + "px;opacity:0";
  gl.appendChild(d);
  if (STARS.indexOf(i) >= 0) {
   var st = document.createElement("div"), L = l[2] * 7;
   st.className = "star";
   st.style.cssText = "left:" + l[0] + "px;top:" + l[1] + "px;width:0;height:0;opacity:0";
   st.innerHTML = '<b style="width:' + L + 'px;height:2px;margin:-1px 0 0 ' + (-L / 2) + 'px"></b><b style="width:' + (L * .55) + 'px;height:2px;margin:-1px 0 0 ' + (-L * .275) + 'px;transform:rotate(90deg)"></b>';
   gl.appendChild(st);
  }
 });

 // soft floating motes (fresh air), kept off the label: left and right of the can
 var mo = document.getElementById("motes"), MOTES = [];
 for (var k = 0; k < 26; k++) {
  var side = k % 2 ? 1 : -1;
  var x = side < 0 ? 40 + rnd() * 290 : 640 + rnd() * 380;
  var y = 650 + rnd() * 900, r = 5 + rnd() * rnd() * 26, green = rnd() < .55;
  var m = document.createElement("div");
  m.className = "mote";
  m.style.cssText = "left:" + x + "px;top:" + y + "px;width:" + (r * 2) + "px;height:" + (r * 2) + "px;opacity:0;" +
   "filter:blur(" + (1 + r / 7).toFixed(1) + "px);background:radial-gradient(closest-side," +
   (green ? "rgba(196,236,170,.9),rgba(150,210,130,0)" : "rgba(255,252,240,.85),rgba(255,250,235,0)") + ")";
  mo.appendChild(m);
  MOTES.push({el: m, rise: 140 + rnd() * 260, sway: (rnd() - .5) * 70, delay: rnd() * 2.2, op: .25 + rnd() * .5});
 }

 var tl = gsap.timeline({paused:true});
 function txt(sel, at, st){ tl.fromTo(sel,{opacity:0,y:30,filter:"blur(10px)"},{opacity:1,y:0,filter:"blur(0px)",duration:.7,ease:"power3.out",stagger:st||0},at); }
 function out(sel, at){ tl.to(sel,{opacity:0,y:-20,filter:"blur(8px)",duration:.4,ease:"power2.in"},at); }

 // ---- camera: focus pull in, slow push towards the can, a little hand-held breathing ----
 tl.fromTo("#photo",{filter:"blur(7px) brightness(.85)"},{filter:"blur(0px) brightness(1)",duration:1.1,ease:"power2.out"},0);
 tl.fromTo("#cam",{scale:1.03},{scale:1.1,duration:10,ease:"sine.inOut"},0);
 tl.fromTo("#cam",{x:-5},{x:5,duration:2.5,ease:"sine.inOut",yoyo:true,repeat:3},0);
 tl.fromTo("#cam",{y:4},{y:-4,duration:2,ease:"sine.inOut",yoyo:true,repeat:4},0);
 tl.fromTo("#cam",{rotation:-.3},{rotation:.3,duration:3.3,ease:"sine.inOut",yoyo:true,repeat:2},0);

 // ---- light: spots breathe, three of them glint; a sheen runs over the can twice ----
 gsap.utils.toArray("#glints .glow").forEach(function(el, i){
  tl.fromTo(el,{opacity:0,scale:.8},{opacity:.55,scale:1,duration:1.2,ease:"sine.out"},.3 + i * .05);
  tl.to(el,{opacity:.25,scale:.9,duration:1.1 + (i % 4) * .3,ease:"sine.inOut",yoyo:true,repeat:5},1.6 + i * .05);
 });
 gsap.utils.toArray("#glints .star").forEach(function(el, i){
  var at = [2.0, 5.6, 8.1][i];
  tl.fromTo(el,{opacity:0,rotation:-20,scale:.4},{opacity:1,rotation:0,scale:1,duration:.45,ease:"power2.out"},at);
  tl.to(el,{opacity:0,rotation:15,scale:.6,duration:.7,ease:"power2.in"},at + .45);
 });
 tl.fromTo("#sh1",{x:0,opacity:1},{x:560,duration:1.3,ease:"power2.inOut"},1.2);
 tl.fromTo("#sh2",{x:0,opacity:1},{x:560,duration:1.3,ease:"power2.inOut"},7.6);

 // ---- motes drift up ----
 MOTES.forEach(function(m){
  tl.fromTo(m.el,{opacity:0,y:0,x:0},{opacity:m.op,duration:1.2,ease:"sine.out"},.6 + m.delay);
  tl.to(m.el,{y:-m.rise,x:m.sway,duration:10 - (.6 + m.delay),ease:"none"},.6 + m.delay);
  tl.to(m.el,{opacity:0,duration:1.4,ease:"sine.in"},8.4);
 });

 // ---- copy ----
 tl.fromTo("#logo",{opacity:0,y:-16,filter:"blur(6px)"},{opacity:1,y:0,filter:"blur(0px)",duration:.7,ease:"power3.out"},.4);
 txt(".h1",.7,.18);
 out(".h1",3.6);
 txt(".h2",4.0,.18);
 tl.fromTo("#chips .chip",{opacity:0,y:20,scale:.92},{opacity:1,y:0,scale:1,duration:.5,ease:"back.out(1.6)",stagger:.18},4.5);
 out(".h2",6.9);
 tl.to("#chips",{opacity:0,y:16,duration:.35,ease:"power2.in"},6.9);
 txt(".h3",7.3,.18);
 tl.fromTo("#panel",{opacity:0,y:30,scale:.96},{opacity:1,y:0,scale:1,duration:.6,ease:"power3.out"},7.3);
 txt("#a1",7.5);
 tl.fromTo("#pill",{opacity:0,scale:.7},{opacity:1,scale:1,duration:.5,ease:"back.out(1.8)"},7.75);
 txt("#d1",8.05);
 tl.fromTo("#truck path, #truck circle",{attr:{"stroke-dasharray":"1 1","stroke-dashoffset":1}},{attr:{"stroke-dashoffset":0},duration:.6,ease:"power2.inOut",stagger:.08},8.1);

 window.__timelines = window.__timelines || {};
 window.__timelines["story"] = tl;
})();
</script>
</template>
